# Each hook runs one of the repository's own commands (docs/contributing/testing.md). Not installed by default;
# `uv run pre-commit install` installs both stages.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: fast-tier
        name: fast tier (tests/contract, not slow)
        entry: uv run pytest tests/contract -q -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: full-tier
        name: full tier (all but cuda and bench)
        entry: uv run pytest tests -q -m "not bench and not cuda"
        language: system
        pass_filenames: false
        stages: [pre-push]
