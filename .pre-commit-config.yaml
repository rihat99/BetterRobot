# Each hook runs one of the repository's own commands (docs/guides/run-the-tests.md). Not installed by default;
# `uv run pre-commit install` installs both stages.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: fast-tier
        name: fast tier (tests/contract, not slow, not cuda)
        entry: uv run pytest tests/contract -q -m "not slow and not cuda"
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: full-tier
        name: full tier (all but cuda and bench)
        entry: uv run pytest tests -q -m "not bench and not cuda"
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: lie-spatial-coverage
        name: lie + spatial branch coverage at 100 % (coverage gate)
        entry: bash -c 'uv run coverage run --branch --source=src/better_robot/lie,src/better_robot/spatial -m pytest tests/lie tests/spatial -q -m "not cuda" && uv run coverage report --fail-under=100'
        language: system
        pass_filenames: false
        stages: [pre-push]
