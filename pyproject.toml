[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-robot"
version = "0.2.0"
description = "PyTorch-native robot kinematics, dynamics, and optimisation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "yourdfpy>=0.0.14",
]

[project.optional-dependencies]
viewer = ["viser>=1.0.18"]
io-mjcf = ["mujoco>=3.1"]
meshes = ["trimesh>=4.0.0"]
demos = ["robot_descriptions>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "pytest-benchmark>=4",
    "scipy>=1.11",
    "hypothesis>=6.100",
    "pin>=2.7",
    "pyperf>=2.7",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "matplotlib>=3.8",
    "ruff",
    "pyright",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "jaxtyping>=0.2.30",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[tool.hatch.build.targets.wheel]
packages = ["src/better_robot"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = ["test_*.py", "bench_*.py"]  # bench_* files carry the bench marker; -m bench selects them
markers = [
    "slow: long-running tests (skip with '-m \"not slow\"')",
    "cuda: tests requiring a CUDA device",
    "bench: benchmark micro-tests (advisory; not part of contract)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "PLC", "PLE", "PLR", "PLW", "B006", "B008", "T201", "E722", "TID251",
          "FBT001", "FBT002", "BLE001", "ERA001", "ANN201"]
ignore = ["E501", "PLR0913", "PLR2004"]
# Contract rules deferred until the polish phase clears their violations (counts on 2026-10-07, `src/` only):
#   "N"      113  C-NAME-2 (needs per-file ignores for N803/N806 in lie, spatial, kinematics, dynamics)
#   "D"      305  C-DOC-1  (numpy convention; D1xx on public names only)
#   "ANN001" 132  C-TEST-2
#   "SLF001"  31  C-EXT-3
# Enabled above with open violations listed in the task ledger (p1_violations.md):
#   FBT001 9, FBT002 3, BLE001 2, ERA001 7, ANN201 4.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "FBT001", "FBT002", "ERA001"]
"examples/**" = ["ANN201", "T201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch.set_default_dtype".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_default_device".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_grad_enabled".msg = "C-DEP-3 / C-DIFF-4: no global autograd switches inside the library"
"torch.use_deterministic_algorithms".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.manual_seed".msg = "C-DEP-3: no process-wide RNG seeding inside the library; take a generator"
"torch.set_num_threads".msg = "C-DEP-3: no process-wide thread settings inside the library"
"torch.set_num_interop_threads".msg = "C-DEP-3: no process-wide thread settings inside the library"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_unreachable = true
no_implicit_optional = true
disallow_untyped_defs = false
files = ["src/better_robot"]

[tool.coverage.run]
branch = true
source = ["better_robot"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@runtime_checkable",
]
