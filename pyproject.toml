[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-robot"
version = "0.2.0"
description = "PyTorch-native robot kinematics, dynamics, and optimisation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "yourdfpy>=0.0.14",
]

[project.optional-dependencies]
viewer = ["viser>=1.0.30", "pillow>=10"]
mjcf = ["mujoco>=3.1"]
meshes = ["trimesh>=4.0.0"]
demos = ["robot_descriptions>=1.0.0"]
testing = ["pytest>=8.0"]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=8.0",
    "coverage>=7",
    "pyright",
    "pre-commit>=3.7",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
test-oracles = [
    "pin>=2.7",
    "scipy>=1.11",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[tool.hatch.build.targets.wheel]
packages = ["src/better_robot"]

[tool.pytest.ini_options]
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["tests"]
xfail_strict = true
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    "error",
    # torch 2.13 deprecates its own internals yet still calls them: torch.func.jvp's decompositions call
    # torch.jit.script, inductor's import of torch.utils.mkldnn calls torch.jit.script_method, and inductor's
    # decomposition of diagonal calls torch._prims_common.check. No code here calls any of them: ruff's banned-api
    # list rejects all three.
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
    "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
    "ignore:`torch._prims_common.check` is deprecated:FutureWarning",
    # pin 3.9's `pinocchio/__init__.py` imports `hppfcl`, the deprecated alias of its own dependency coal.
    "ignore:Please update your 'hppfcl' imports to 'coal':DeprecationWarning",
]
markers = [
    "cuda: needs a CUDA device; deselected in the fast and full tiers, run in the release tier",
    "slow: takes seconds; deselected in the fast tier, run in the full tier",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "PLC", "PLE", "PLR", "PLW", "B006", "B008", "T201", "E722", "TID251",
          "FBT001", "FBT002", "BLE001", "ERA001", "ANN201", "S102", "S307"]
ignore = ["E501", "PLR0913", "PLR2004"]
# Contract rules with open sites in `src/` run as shrink-only ratchets in tests/contract/test_ruff_ratchets.py, not
# here: "N" (C-NAME-2), "D1" (C-DOC-1), "ANN001" (C-TEST-2), "SLF001" (C-EXT-3). S102 and S307: no exec or eval
# (principle 4.2).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "FBT001", "FBT002", "ERA001"]
"examples/**" = ["ANN201", "T201"]
"benchmarks/**" = ["T201"]  # scripts that report on stdout, as the examples do
"src/better_robot/{lie,spatial,kinematics,dynamics}/**" = ["N803", "N806"]  # monogram names in math code, C-NAME-1

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # C-DOC-1; it documents __init__ in the class docstring, so D107 is off

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch.set_default_dtype".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_default_device".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_grad_enabled".msg = "C-DEP-3: no global autograd switches inside the library"
"torch.use_deterministic_algorithms".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.set_float32_matmul_precision".msg = "C-DEP-3: no process-wide torch settings inside the library"
"torch.manual_seed".msg = "C-DEP-3: no process-wide RNG seeding inside the library; take a generator"
"torch.set_num_threads".msg = "C-DEP-3: no process-wide thread settings inside the library"
"torch.set_num_interop_threads".msg = "C-DEP-3: no process-wide thread settings inside the library"
"torch.jit.script".msg = "deprecated in torch 2.13; the pytest filter ignoring its DeprecationWarning holds only while no code here calls it"
"torch.jit.script_method".msg = "deprecated in torch 2.13; the pytest filter ignoring its DeprecationWarning holds only while no code here calls it"
"torch._prims_common.check".msg = "deprecated in torch 2.13; the pytest filter ignoring its FutureWarning holds only while no code here calls it"

[tool.coverage.run]
branch = true
source = ["better_robot"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@runtime_checkable",
]
